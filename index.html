<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>○○정밀 홈페이지 시안 3종 · 제안용 데모</title>
<meta name="description" content="B2B 제조 회사 소개 홈페이지 제안용 데모예요. 같은 내용을 디자인 3종(정갈형·큰사진형·카탈로그형)으로 바꿔 보고, 회사 이름 바꾸기, 제품 상세와 규격표, 문의 폼과 메일 도착 모습을 직접 눌러 볼 수 있어요. 회사와 제품은 예시예요.">
<meta name="theme-color" content="#191F28">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191F28'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ink:#191F28; --ink-2:#4E5968; --mut:#636D7B; --mut-2:#9AA3AE;
  --line:#E5E8EB; --line-2:#EBEEF2; --soft:#F7F8FA; --track:#ECEFF3;
  --bg:#F2F4F7; --surface:#FFFFFF;
  --bad:#BF2930; --bad-bg:#FFE3E4; --ok:#127A4F; --ok-bg:#E3F6ED;
  --brand:#2457F5; --brand-hover:#1B45D6; --brand-text:#1B45D6; --brand-tint:#EEF3FF; --on-brand:#fff;
  --ring:0 0 0 3px rgba(36,87,245,.25);
  --r-sm:8px; --r-md:12px; --r-card:20px; --r-img:20px; --r-pill:999px;
  --sh-pop:0 2px 6px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.12);
}
/* 디자인 A 정갈형: 회백색 + 흰 카드 + 파랑 하나 */
[data-t="a"]{ --bg:#F2F4F7; --surface:#fff; }
/* 디자인 B 큰사진형: 따뜻한 회백색 + 검정 + 노랑 알약 하나 */
[data-t="b"]{
  --bg:#F3F1EC; --surface:#FBFAF7; --soft:#ECE9E2; --track:#E4E0D7;
  --ink:#151515; --ink-2:#3B3A37; --mut:#5C5B56; --line:#D9D5CC; --line-2:#E2DED6;
  --brand:#151515; --brand-hover:#000; --brand-text:#151515; --brand-tint:#ECE9E2;
  --accent:#F2B01E; --ring:0 0 0 3px rgba(21,21,21,.22);
  --r-card:28px; --r-img:28px;
}
/* 디자인 C 카탈로그형: 촘촘한 회색 + 초록 하나 */
[data-t="c"]{
  --bg:#EEF1F4; --surface:#fff;
  --brand:#12804C; --brand-hover:#0B6B42; --brand-text:#0B6B42; --brand-tint:#EBF7F0;
  --ring:0 0 0 3px rgba(18,128,76,.25);
  --r-card:12px; --r-img:8px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media (min-width:768px){.wrap{padding:0 32px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.ex{font-size:12px;color:var(--mut);font-weight:500}

/* ───── 데모 안내 띠 (사이트 바깥) ───── */
.demobar{background:#191F28;color:#fff;font-size:13px;position:relative;z-index:30}
.demobar .in{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.demotag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);background:#F2B01E;color:#191F28;font-weight:700;font-size:12px;white-space:nowrap}
.demotxt{display:none;color:#C9CED6;flex:1 1 auto;min-width:0}
@media (min-width:600px){.demotxt{display:block}}
.seg{order:3;display:flex;gap:2px;background:#2B323D;border-radius:var(--r-pill);padding:2px;flex:1 1 100%}
.seg button{flex:1;min-height:44px;border:0;border-radius:var(--r-pill);background:transparent;color:#C9CED6;font-size:14px;font-weight:600;padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:#191F28}
.seg button:hover:not([aria-pressed="true"]){color:#fff}
.namebtn{margin-left:auto;min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid #4A5361;background:transparent;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.namebtn:hover{background:#2B323D}
@media (min-width:900px){
  .demobar .in{padding:8px 32px;flex-wrap:nowrap}
  .seg{flex:0 0 auto;order:0}
  .namebtn{margin-left:0}
  .seg button{padding:0 16px}
}

/* ───── 사이트 머리 ───── */
.hd{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line-2)}
[data-t="b"] .hd{background:var(--bg);border-bottom-color:var(--line)}
.hd .in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;border:0;background:none;padding:0}
.logo svg{flex:none}
.logo small{font-size:12px;font-weight:500;color:var(--mut);margin-left:2px}
.nav{display:none;align-items:center;gap:4px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:var(--r-pill);text-decoration:none;font-size:15px;font-weight:500;color:var(--ink-2)}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current="page"]{color:var(--brand-text);background:var(--brand-tint);font-weight:600}
[data-t="b"] .nav a[aria-current="page"]{background:transparent;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
[data-t="c"] .nav a{border-radius:var(--r-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-pill);border:1px solid transparent;font-size:16px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-p:hover{background:var(--brand-hover)}
.btn-p:active{transform:translateY(1px)}
.btn-p[disabled]{opacity:.6;cursor:progress}
.btn-s{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-s:hover{background:var(--soft)}
[data-t="b"] .btn-y{background:var(--accent);color:#151515}
[data-t="b"] .btn-y:hover{background:#E0A10F}
[data-t="c"] .btn{border-radius:var(--r-sm);min-height:44px;font-size:15px;padding:0 20px}
.hd .btn{min-height:44px;padding:0 20px;font-size:15px}
.hd-cta{display:none}
.menubtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface)}
.mnav{display:none;border-top:1px solid var(--line-2);background:var(--surface);padding:8px 16px 16px}
[data-t="b"] .mnav{background:var(--bg)}
.mnav.open{display:block}
.mnav a{display:flex;align-items:center;min-height:52px;font-size:17px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-2)}
.mnav a[aria-current="page"]{color:var(--brand-text)}
.mnav .btn{width:100%;margin-top:12px}
@media (min-width:900px){
  .nav,.hd-cta{display:inline-flex}
  .menubtn,.mnav,.mnav.open{display:none}
}

/* ───── 공통 구역 ───── */
main{display:block;min-height:60vh}
.sec{padding-top:56px;padding-bottom:56px}
@media (min-width:768px){.sec{padding-top:96px;padding-bottom:96px}}
.h-page{font-size:32px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:0}
.h-sec{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.lead{font-size:17px;color:var(--ink-2);margin:12px 0 0;max-width:640px}
@media (min-width:768px){.h-page{font-size:44px}.h-sec{font-size:32px}}
.pagehead{padding-top:40px;padding-bottom:8px}
@media (min-width:768px){.pagehead{padding-top:64px;padding-bottom:16px}}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card)}
.photo{border-radius:var(--r-img);overflow:hidden;background:var(--track)}
.photo img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;background:var(--brand-tint);color:var(--brand-text);white-space:nowrap}
[data-t="b"] .pill{background:var(--accent);color:#151515}
[data-t="c"] .pill{border-radius:var(--r-sm);height:24px;padding:0 8px;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:768px){.chips{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap}}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--mut-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
[data-t="c"] .chip{border-radius:var(--r-sm)}
.chip .n{font-size:13px;opacity:.7;margin-left:4px}

/* ───── A 홈 ───── */
.a-hero{display:grid;gap:24px;padding-top:32px;padding-bottom:56px}
.a-hero h1{font-size:32px;line-height:1.25;letter-spacing:-.025em;margin:0;font-weight:700}
.a-hero .lead{margin-top:16px}
.a-hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.a-hero .photo{aspect-ratio:4/3}
.a-facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:24px;font-size:14px;color:var(--mut)}
.a-facts b{color:var(--ink);font-weight:600;margin-right:4px}
@media (min-width:900px){
  .a-hero{grid-template-columns:5fr 6fr;align-items:center;gap:48px;padding-top:64px;padding-bottom:96px}
  .a-hero h1{font-size:48px}
}
.a-feat{display:grid;gap:12px}
.a-feat .big{overflow:hidden;display:grid;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-card);padding:0}
.a-feat .big .photo{border-radius:0;aspect-ratio:16/10}
.a-feat .big .tx{padding:20px 24px 24px}
.a-feat .big h3{font-size:24px;margin:8px 0 4px;letter-spacing:-.02em}
.a-feat .big p{margin:0;color:var(--ink-2)}
.a-list{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);padding:8px 0}
.a-list button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:12px 20px;border:0;background:none;text-align:left;min-height:88px;border-bottom:1px solid var(--line-2)}
.a-list li:last-child button{border-bottom:0}
.a-list button:hover{background:var(--soft)}
.a-list ul{list-style:none;margin:0;padding:0}
.a-list .photo{width:64px;height:64px;border-radius:var(--r-md)}
.a-list b{display:block;font-size:17px;font-weight:600}
.a-list span{font-size:14px;color:var(--mut)}
.a-list .go{font-size:14px;color:var(--brand-text);font-weight:600}
@media (min-width:900px){.a-feat{grid-template-columns:7fr 5fr}}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px}
.sec-head p{margin:0;color:var(--mut)}
.textlink{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--brand-text);text-decoration:none}
.textlink:hover{text-decoration:underline}
.a-proc{display:grid;overflow:hidden}
.a-proc .photo{border-radius:0;aspect-ratio:4/3}
.a-proc .tx{padding:24px}
.a-proc ol{list-style:none;margin:16px 0 0;padding:0}
.a-proc li{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line-2)}
.a-proc li b{font-weight:600}
.a-proc li span{color:var(--ink-2);font-size:15px}
@media (min-width:900px){.a-proc{grid-template-columns:1fr 1fr}.a-proc .photo{aspect-ratio:auto;min-height:100%}.a-proc .tx{padding:48px}}
.ctaband{display:grid;gap:16px;align-items:center;padding:32px 24px}
.ctaband h2{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.3}
.ctaband p{margin:8px 0 0;color:var(--ink-2)}
@media (min-width:768px){.ctaband{grid-template-columns:1fr auto;padding:40px 48px}.ctaband h2{font-size:32px}}

/* ───── B 홈 ───── */
.b-hero{padding:40px 0 0}
.b-hero h1{font-size:44px;line-height:1.08;letter-spacing:-.04em;font-weight:800;margin:0}
.b-hero .row{display:grid;gap:20px;margin-top:24px}
.b-hero .row p{margin:0;font-size:17px;color:var(--ink-2);max-width:520px}
.b-hero .acts{display:flex;flex-wrap:wrap;gap:8px}
.b-big{position:relative;margin-top:32px;aspect-ratio:4/5;border-radius:0;overflow:hidden;background:var(--track)}
.b-big img{width:100%;height:100%;object-fit:cover}
.b-big .cap{position:absolute;left:16px;bottom:16px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:var(--r-pill)}
@media (min-width:768px){
  .b-hero{padding:72px 0 0}
  .b-hero h1{font-size:88px}
  .b-hero .row{grid-template-columns:1fr auto;align-items:end;margin-top:40px}
  .b-big{aspect-ratio:21/9;margin:48px 32px 0;border-radius:var(--r-img)}
  .b-big .cap{left:24px;bottom:24px}
}
@media (min-width:1264px){.b-big{max-width:1200px;margin-left:auto;margin-right:auto}}
.b-nums{display:grid;grid-template-columns:1fr;border-top:1px solid var(--ink)}
.b-nums div{padding:16px 0;border-bottom:1px solid var(--line)}
.b-nums strong{display:block;font-size:44px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
.b-nums span{font-size:15px;color:var(--ink-2)}
@media (min-width:768px){.b-nums{grid-template-columns:repeat(3,1fr)}.b-nums div{padding:32px 24px 32px 0;border-bottom:0}.b-nums div+div{border-left:1px solid var(--line);padding-left:24px}.b-nums strong{font-size:56px}}
.b-make h2{font-size:40px;letter-spacing:-.035em;line-height:1.1;margin:0 0 24px;font-weight:800}
@media (min-width:768px){.b-make h2{font-size:64px;margin-bottom:40px}}
.b-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.b-rows button{width:100%;display:grid;grid-template-columns:1fr 88px;grid-template-areas:"n p" "m p";gap:8px 16px;align-items:center;padding:20px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;min-height:96px}
.b-rows button>div:first-child{grid-area:n}.b-rows .meta{grid-area:m}.b-rows .photo{grid-area:p}
.b-rows b{display:block;font-size:22px;letter-spacing:-.02em;font-weight:700;line-height:1.3}
.b-rows .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-self:start;font-size:14px;color:var(--mut)}
.b-rows .photo{width:88px;height:88px;border-radius:var(--r-pill)}
.b-rows button:hover b{text-decoration:underline;text-underline-offset:4px}
@media (min-width:768px){.b-rows button{grid-template-columns:1fr 240px 120px;grid-template-areas:"n m p";padding:24px 0}.b-rows .meta{align-self:center}.b-rows b{font-size:32px}.b-rows .photo{width:120px;height:120px}.b-rows .meta{margin:0}}
.b-quote{background:#151515;color:#F3F1EC;padding:56px 0}
.b-quote h2{font-size:36px;line-height:1.15;letter-spacing:-.035em;margin:0 0 24px;font-weight:800}
.b-quote p{color:#C9C6BE;margin:0 0 24px;max-width:520px}
@media (min-width:768px){.b-quote{padding:96px 0}.b-quote h2{font-size:64px}}

/* ───── C 카탈로그 ───── */
.c-top{padding-top:24px;padding-bottom:16px}
.c-top .h-page{font-size:28px}
@media (min-width:768px){.c-top{padding-top:40px;padding-bottom:24px}.c-top .h-page{font-size:32px}}
.c-intro{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:14px;color:var(--mut)}
.c-grid{display:grid;gap:16px;padding-bottom:56px}
@media (min-width:1000px){.c-grid{grid-template-columns:1fr 300px;align-items:start;gap:24px}}
.c-tools{display:grid;gap:12px;padding:16px;border-bottom:1px solid var(--line-2)}
.search{position:relative}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 16px 0 44px;font-size:16px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.search svg{position:absolute;left:14px;top:14px;color:var(--mut)}
.c-tools .chips{margin:0;padding:0}
.c-count{font-size:14px;color:var(--mut);padding:12px 16px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--soft);color:var(--mut);font-weight:500;font-size:13px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .thumb{width:56px;height:56px;border-radius:var(--r-sm);overflow:hidden;background:var(--track)}
.tbl .thumb img{width:100%;height:100%;object-fit:cover}
.tbl .pn{font-weight:600;font-size:15px}
.tbl .code{font-family:var(--mono);font-size:12px;color:var(--mut)}
.tbl .more{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.tbl .more:hover{border-color:var(--brand);color:var(--brand-text)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FAFBFC}
.c-cards{display:none;list-style:none;margin:0;padding:0}
.c-cards button{width:100%;display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;min-height:96px}
.c-cards li:last-child button{border-bottom:0}
.c-cards .thumb{width:72px;height:72px;border-radius:var(--r-sm);overflow:hidden;background:var(--track)}
.c-cards .thumb img{width:100%;height:100%;object-fit:cover}
.c-cards .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.c-cards b{font-size:16px}
.c-cards .r2{font-size:13px;color:var(--mut);margin-top:4px}
@media (max-width:767px){.c-tablewrap{display:none}.c-cards{display:block}}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:16px}
.c-side{display:grid;gap:16px}
.c-side .card{padding:20px}
.c-side h3{font-size:17px;margin:0 0 12px}
.c-side ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.c-side li{margin-bottom:8px}
.c-side dl{margin:0;font-size:14px;display:grid;grid-template-columns:72px 1fr;gap:8px}
.c-side dt{color:var(--mut)}
.c-side dd{margin:0}
.c-side .btn{width:100%;margin-top:16px}

/* ───── 제품 목록 A / B ───── */

function bindInquiry(){
  const f = $('#inq'); if (!f) return;
  const body = $('#body'), cnt = $('#cnt');
  const upd = () => cnt.textContent = body.value.length.toLocaleString();
  body.addEventListener('input', upd); upd();
  const rules = {
    company: v => v.trim().length >= 1,
    person: v => v.trim().length >= 2,
    phone: v => /^\d{9,11}$/.test(v.replace(/[^\d]/g, '')) && /^[\d\-\s()+]+$/.test(v.trim()),
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()),
    qty: v => !v.trim() || /^[\d,]+$/.test(v.trim()),
    body: v => v.trim().length >= 10,
  };
  const check = name => {
    const box = f.querySelector(`[data-f="${name}"]`);
    let ok = true;
    if (name === 'agree') ok = $('#agree').checked;
    else if (name === 'file'){ const fl = $('#file').files[0]; ok = !fl || fl.size <= 10 * 1024 * 1024; }
    else ok = rules[name](f.elements[name].value);
    box.classList.toggle('err', !ok);
    const inp = name === 'file' ? $('#file') : f.elements[name];
    if (inp) inp.setAttribute('aria-invalid', !ok);
    return ok;
  };
  Object.keys(rules).forEach(n => {
    f.elements[n].addEventListener('blur', () => { if (f.elements[n].value || n === 'body') check(n); });
    f.elements[n].addEventListener('input', () => { if (f.querySelector(`[data-f="${n}"]`).classList.contains('err')) check(n); });
  });
  $('#agree').addEventListener('change', () => check('agree'));
  $('#file').addEventListener('change', () => { const fl = $('#file').files[0]; $('#fname').textContent = fl ? `${fl.name} · ${(fl.size / 1048576).toFixed(1)}MB` : 'PDF, DWG, STEP, JPG'; check('file'); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const names = ['company','person','phone','email','qty','body','file','agree'];
    const bad = names.filter(n => !check(n));
    if (bad.length){
      const first = bad[0] === 'agree' ? $('#agree') : bad[0] === 'file' ? $('#file') : f.elements[bad[0]];
      first.focus({preventScroll:true});
      f.querySelector(`[data-f="${bad[0]}"]`).scrollIntoView({block:'center', behavior:'smooth'});
      toast(`${bad.length}곳을 확인해 주세요`);
      return;
    }
    const btn = $('#send'); if (btn.disabled) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>보내는 중';
    const data = Object.fromEntries(new FormData(f));
    data.fileName = $('#file').files[0]?.name || '';
    setTimeout(() => showDone(data), 900);
  });
}
function showDone(d){
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const rid = `Q-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${String(Math.floor(Math.random() * 9000) + 1000)}`;
  const p = d.product === 'etc' ? '목록에 없는 부품' : d.product ? prod(d.product).name : '고르지 않음';
  const rows = [['문의 종류', d.type],['회사명', d.company],['담당자', d.person],['연락처', d.phone],['이메일', d.email],['관심 제품', p],['수량', d.qty || '적지 않음'],['첨부', d.fileName || '없음'],['문의 내용', d.body],['접수 번호', rid]];
  $('#formBox').innerHTML = `
  <div class="done" tabindex="-1" id="doneBox">
    <div class="ok"><i>${icon.check}</i><h2>문의를 보냈어요</h2></div>
    <p class="rid">접수 번호 <b>${rid}</b> · 담당자가 영업일 하루 안에 ${esc(d.email)}로 답장드려요.</p>
    <div class="mail" aria-label="담당자 메일함에 도착하는 메일 미리보기">
      <div class="bar"><span>담당자 메일함에 이렇게 도착해요</span><span class="num">${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}</span></div>
      <dl class="hdrs">
        <div><dt>보낸 사람</dt><dd>${N()} 홈페이지 &lt;no-reply@회사도메인&gt;</dd></div>
        <div><dt>받는 사람</dt><dd>영업 담당 &lt;sales@example.co.kr&gt;</dd></div>
        <div><dt>답장 주소</dt><dd>${esc(d.person)} &lt;${esc(d.email)}&gt;</dd></div>
      </dl>
      <div class="subj">[홈페이지 문의] ${esc(d.type)} · ${esc(d.company)}</div>
      <table><tbody>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
    </div>
    <p class="note">데모라서 실제로 보내지는 않아요. 실제 사이트에서는 이 내용이 정해 둔 메일 주소(여러 명도 가능)로 바로 가고, 메일에서 '답장'을 누르면 문의한 분께 바로 답할 수 있어요.</p>
    <div class="acts"><button class="btn btn-s" type="button" id="again">다시 작성하기</button><a class="btn btn-s" href="${href('products')}">제품 더 보기</a></div>
  </div>`;
  $('#doneBox').focus({preventScroll:true});
  $('#formBox').scrollIntoView({block:'start', behavior:'smooth'});
  $('#again').onclick = () => { S.prefill = null; render(true); };
  toast('문의를 보냈어요');
}

/* ─────────── 제품 상세 ─────────── */
function openProduct(id, opener){
  const p = prod(id); if (!p) return;
  S.lastFocus = opener || document.activeElement;
  const pm = $('#pm');
  pm.innerHTML = `
  <div class="pm-in">
    <div class="photo">${pic(p.ph,'(min-width:860px) 480px, 100vw',p.name,true)}</div>
    <div class="tx">
      <span class="pill">${p.cat}</span> <span class="code" style="font-family:var(--mono);font-size:13px;color:var(--mut);margin-left:6px">${p.code}</span>
      <h2 id="pmTitle">${p.name}</h2>
      <p>${p.sum}</p>
      <table class="spec"><caption>주요 규격<span class="ex">예시</span></caption><tbody>${p.spec.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join('')}</tbody></table>
      <p class="uses"><b style="color:var(--ink)">쓰이는 곳</b> · ${p.uses}</p>
      <div class="acts"><button class="btn btn-s" type="button" data-close>닫기</button><a class="btn btn-p" href="${href('inquiry')}" data-ask="${p.id}">이 제품 견적 문의하기</a></div>
    </div>
  </div>
  <button class="x" type="button" data-close aria-label="닫기">${icon.close}</button>`;
  pm.showModal();
  pm.querySelector('.tx').scrollTop = 0;
  pm.querySelectorAll('[data-close]').forEach(b => b.onclick = () => pm.close());
  pm.querySelector('[data-ask]').onclick = () => { S.prefill = p.id; pm.close(); };
}
$('#pm').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#pm').addEventListener('close', () => { if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus({preventScroll:true}); });

/* ─────────── 라우팅·그리기 ─────────── */
function render(keepScroll){
  document.body.dataset.t = S.t;
  document.querySelectorAll('[data-tpl]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tpl === S.t));
  const titles = {home:'홈', about:'회사 소개', products:'제품 소개', contact:'연락처', inquiry:'문의하기'};
  document.title = `${S.name} ${titles[S.p]} · 홈페이지 시안 ${S.t.toUpperCase()} · 제안용 데모`;
  renderHeader(); renderFooter();
  const m = $('#main');
  m.innerHTML = S.p === 'home' ? (S.t === 'a' ? homeA() : S.t === 'b' ? homeB() : catalogC(false))
    : S.p === 'about' ? aboutPage() : S.p === 'products' ? productsPage() : S.p === 'contact' ? contactPage() : inquiryPage();
  if ($('#cList')){
    renderCList();
    $('#cq').addEventListener('input', e => { S.q = e.target.value; renderCList(); });
  }
  m.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    S.cat = b.dataset.cat;
    if ($('#cList')){ syncChips(); renderCList(); } else { const y = scrollY; render(true); scrollTo(0, y); }
  });
  bindInquiry();
  if (!keepScroll) scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-prod]');
  if (b && !e.target.closest('dialog')){ e.preventDefault(); openProduct(b.dataset.prod, b.closest('button') || b.querySelector('button') || b); }
});
function fromHash(){
  const [t, p] = location.hash.replace('#', '').split('/');
  if (['a','b','c'].includes(t)) S.t = t;
  S.p = ['home','about','products','contact','inquiry'].includes(p) ? p : 'home';
}
window.addEventListener('hashchange', () => { fromHash(); render(); if (S.p !== 'inquiry') S.prefill = null; $('#main').focus({preventScroll:true}); });
document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
  if (S.t === b.dataset.tpl) return;
  S.t = b.dataset.tpl;
  history.replaceState(null, '', `#${S.t}/${S.p}`);
  const y = scrollY; render(true); scrollTo(0, Math.min(y, 0));
  toast(`디자인 ${S.t.toUpperCase()}로 바꿨어요. 내용은 같아요`);
});
const nm = $('#nm');
$('#nameBtn').onclick = () => { $('#nmInput').value = S.name === '○○정밀' ? '' : S.name; nm.showModal(); $('#nmInput').focus(); };
nm.addEventListener('close', () => {
  if (nm.returnValue !== 'ok') return;
  const v = $('#nmInput').value.trim();
  S.name = v || '○○정밀';
  render(true);
  toast(`'${S.name}'(으)로 바꿨어요`);
});
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

fromHash(); render();
</script>
</body>
</html>
